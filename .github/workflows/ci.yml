name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore CostLedger/CostLedger.sln

      - name: Build
        run: dotnet build CostLedger/CostLedger.sln --no-restore -c Release

      - name: Test
        run: dotnet test CostLedger/CostLedger.sln --no-build -c Release --verbosity normal
